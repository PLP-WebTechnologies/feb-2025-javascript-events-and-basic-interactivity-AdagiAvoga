<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Event Playground</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Welcome to my Javascript Playground!</h1>

    <!-- Event handling section -->
     <button id="magicButton">Click Me!</button>
     <div id="hoverArea">Hover over me!</div>
     <input type="text" id="keypressInput" placeholder="Type something...">

     <!-- Interactive Elements Section -->
      <button id="colorChanger">Change Color/Text</button>

      <div class="gallery">
        <img id="galleryImage" src="https://via.placeholder.com/150" alt="Gallery Image">
        <button id="nextImage">Next Image</button>
      </div>

      <div class="tabs">
        <button class="tab" data-tab="tab1">Tab 1</button>
        <button class="tab" data-tab="tab2">Tab 2</button>
        <div id="tab1" class="tab-content">Content for Tab 1</div>
        <div id="tab2" class="tab-content hidden">Content for Tab 2</div>
      </div>

      <!-- Form Validation Section -->
       <form id="signupForm">
        <input type="text" id="name" placeholder="Name" required><br>
        <input type="email" id="email" placeholder="Email" required><br>
        <input type="password" id="password" placeholder="Password" required><br>
        <button type="submit">Sign Up</button>
        <div id="formFeedback"></div>
       </form>
       <script src="script.js"></script>
</body>
</html>
